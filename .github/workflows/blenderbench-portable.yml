name: BlenderBench portable unit tests

on:
  push:
    paths:
      - "benchmarks/blenderbench_direct/**"
      - "tools/direct_*.py"
      - "tests/test_blenderbench_publication.py"
      - "tests/test_direct_*.py"
      - ".github/workflows/blenderbench-portable.yml"
  pull_request:
    paths:
      - "benchmarks/blenderbench_direct/**"
      - "tools/direct_*.py"
      - "tests/test_blenderbench_publication.py"
      - "tests/test_direct_*.py"
      - ".github/workflows/blenderbench-portable.yml"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          check-latest: false
      - name: Install minimal hash-locked fixture environment
        run: >-
          python -m pip install --disable-pip-version-check
          --require-hashes -r benchmarks/blenderbench_direct/requirements-fixture.lock
      - name: Run CPU-only fixture tests
        run: >-
          python -m unittest -v
          tests.test_blenderbench_publication
          tests.test_direct_codex
          tests.test_direct_recovery
          tests.test_direct_saved_cleanup
          tests.test_direct_suite
          tests.test_direct_unrestricted
