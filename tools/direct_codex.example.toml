# Reviewed server config only; the launcher adds exact per-tool approvals
# ONLY with --approve-blender-tools. Keep machine paths outside the repo.
[mcp_servers.blender]
command = "/absolute/server-venv/bin/blender-mcp"
cwd = "/absolute/blender-mcp/mcp"
enabled_tools = ["execute_blender_code_for_cli", "get_render_as_image_for_cli", "get_runtime_python_api_docs_for_cli", "search_api_docs"]
required = true
# Explicit client deadline, NOT a backend timeout override or no-deadline promise.
tool_timeout_sec = 86400

[mcp_servers.blender.env]
BLENDER_MCP_CLI_BACKEND = "bpy"
BLENDER_MCP_BPY_PYTHON = "/absolute/bpy-venv/bin/python"
